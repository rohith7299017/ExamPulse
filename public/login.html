<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exam Pulse - Secure Login Portal">
  <title>Login | Exam Pulse</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <!-- Ambient Background -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-grid"></div>

  <!-- Header Link -->
  <header class="login-header">
    <a href="/" class="brand-logo">
      <div class="pulse-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 12H18L15 21L9 3L6 12H2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">Exam<span class="highlight">Pulse</span></span>
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="login-wrapper">
    <div class="login-card glass-card">
      <div class="login-card-header">
        <h1 class="login-title">Sign in to Exam Pulse</h1>
        <p class="login-subtitle">Access your examination telemetry & portal</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector" id="roleSelector">
        <button type="button" class="role-btn active" data-role="student">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          Student
        </button>
        <button type="button" class="role-btn" data-role="proctor">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Proctor
        </button>
        <button type="button" class="role-btn" data-role="administrator">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin
        </button>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert-box hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate>
        <input type="hidden" id="selectedRole" name="role" value="student">

        <div class="input-group">
          <label for="email" class="input-label">Email Address</label>
          <div class="input-field-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" name="email" class="input-control" placeholder="name@exampulse.com" required autocomplete="email">
          </div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="password" class="input-label">Password</label>
            <a href="#" id="forgotPassBtn" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-field-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="remember">
            <span class="custom-checkbox"></span>
            <span class="checkbox-text">Remember device</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <!-- Demo Accounts Quick Fill -->
      <div class="demo-box">
        <div class="demo-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          Quick Demo Accounts (Click to auto-fill)
        </div>
        <div class="demo-chips">
          <button type="button" class="demo-chip" data-email="student@exampulse.com" data-pass="password123" data-role="student">
            🎓 Student
          </button>
          <button type="button" class="demo-chip" data-email="proctor@exampulse.com" data-pass="password123" data-role="proctor">
            👁️ Proctor
          </button>
          <button type="button" class="demo-chip" data-email="admin@exampulse.com" data-pass="password123" data-role="administrator">
            🛡️ Admin
          </button>
        </div>
      </div>

      <div class="login-footer">
        Back to <a href="/" class="footer-link">Home Page</a>
      </div>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
